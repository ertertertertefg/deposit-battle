<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deposit Battle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="bg-decoration">
        <div class="coin"></div>
        <div class="coin"></div>
        <div class="coin"></div>
    </div>

    <div class="game">
        <div class="card header-card">
            <h1>💰 Deposit Battle</h1>
            <p id="userName">Игрок</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('profile')">👤 Профиль</button>
            <button class="tab-button" onclick="showTab('work')">💼 Работа</button>
            <button class="tab-button" onclick="showTab('leaderboard'); loadLeaderboard();">🏆 Топ</button>
        </div>

        <div id="tab-profile" class="tab-content active">
            <div class="card">
                <h2>Баланс</h2>
                <div id="money">100 000 ₽</div>
            </div>

            <div class="card">
                <h2>Депозит</h2>
                <div id="deposit">🏦 Депозит: 0 ₽</div>
                <input id="depositInput" type="number" placeholder="Введите сумму" inputmode="numeric">
                <div class="button-row">
                    <button id="depositButton">Положить</button>
                    <button id="withdrawButton">Снять</button>
                </div>
            </div>

            <div class="card">
                <div id="day">📅 День: 1</div>
                <button id="nextDayButton">Следующий день</button>
            </div>
        </div>

        <div id="tab-work" class="tab-content">
            <div class="card">
                <h2>Криптовалюта</h2>
                <div id="crypto">₿ Крипта: 0 ₿</div>
                <div id="cryptoPrice">💰 Цена: 50 000 ₽ за 1 ₿</div>
                <input id="cryptoInput" type="number" placeholder="Сколько купить" inputmode="numeric">
                <div class="button-row">
                    <button id="buyCryptoButton">Купить</button>
                    <button id="sellCryptoButton">Продать</button>
                </div>
            </div>

            <div class="card">
                <h2>Акции</h2>
                <div id="stocks">📈 Акции: 0 шт.</div>
                <div id="stockPrice">💰 Цена: 1 000 ₽ за 1 акцию</div>
                <input id="stockInput" type="number" placeholder="Введите количество" inputmode="numeric">
                <div class="button-row">
                    <button id="buyStockButton">Купить</button>
                    <button id="sellStockButton">Продать</button>
                </div>
            </div>
        </div>

        <div id="tab-leaderboard" class="tab-content">
            <div class="card">
                <h2>🏆 Топ 10 трейдеров</h2>
                <p class="subtitle">Кто больше заработал на крипте и акциях</p>
                <div id="leaderboardList" class="leaderboard-list">
                    <div class="loading">Загрузка...</div>
                </div>
                <button id="refreshLeaderboard" class="refresh-btn">🔄 Обновить</button>
            </div>
        </div>

        <div class="card">
            <h2>Новости</h2>
            <div id="news">📰 Добро пожаловать в игру!</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
