<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deposit Battle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="game">
        <!-- ═══════ ГЛАВНЫЙ ЭКРАН ═══════ -->
        <div id="tab-main" class="tab-content active">
            <div class="hero-card">
                <div class="hero-avatar" id="heroAvatar">🥚</div>
                <div class="hero-rank" id="userRank">Бомж</div>
                <div class="hero-name" id="userName">Игрок</div>
            </div>

            <div class="main-balance">
                <div class="balance-label">💰 Баланс</div>
                <div class="balance-amount" id="money">35 000 ₽</div>
            </div>

            <div class="main-stats">
                <div class="stat-item">
                    <div class="stat-icon">📅</div>
                    <div class="stat-value" id="day">1</div>
                    <div class="stat-label">День</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">🔥</div>
                    <div class="stat-value" id="loginStreak">0</div>
                    <div class="stat-label">Серия</div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">🏆</div>
                    <div class="stat-value" id="achCount">0/8</div>
                    <div class="stat-label">Ачивки</div>
                </div>
            </div>

            <button id="nextDayButton" class="main-action-btn">➡️ Следующий день</button>

            <div class="achievements-preview">
                <h3>🏆 Последние ачивки</h3>
                <div id="achievementsPreview" class="ach-preview-list">
                    <div class="ach-preview-empty">Пока нет ачивок</div>
                </div>
            </div>
        </div>

        <!-- ═══════ ВКЛАДКА РАБОТА ═══════ -->
        <div id="tab-work" class="tab-content">
            <div class="section-title">💼 Работа</div>
            
            <div class="card work-card">
                <div class="work-avatar">👷</div>
                <div class="work-info">
                    <div class="work-title">Работа на дядю</div>
                    <div class="work-salary">+5 000 ₽ за смену</div>
                </div>
                <button id="workButton">Работать</button>
                <div id="workTimer" class="work-timer"></div>
            </div>

            <div class="section-title">🏦 Депозит</div>
            
            <div class="card deposit-card">
                <div class="deposit-balance" id="deposit">0 ₽</div>
                <div class="deposit-rate">📈 1% в день</div>
                <input id="depositInput" type="number" placeholder="Сумма" inputmode="numeric">
                <div class="button-row">
                    <button id="depositButton">Положить</button>
                    <button id="withdrawButton">Снять</button>
                </div>
            </div>

            <div class="section-title">💎 Криптовалюта</div>
            
            <div class="card asset-card">
                <div class="asset-header">
                    <div class="asset-icon">₿</div>
                    <div class="asset-price" id="cryptoPrice">23 000 ₽</div>
                </div>
                <div class="asset-owned" id="crypto">0 ₿</div>
                <input id="cryptoInput" type="number" placeholder="Количество" inputmode="numeric">
                <div class="button-row">
                    <button id="buyCryptoButton">Купить</button>
                    <button id="sellCryptoButton">Продать</button>
                </div>
                <div class="chart-container">
                    <canvas id="cryptoChart"></canvas>
                </div>
            </div>

            <div class="section-title">📈 Акции</div>
            
            <div class="card asset-card">
                <div class="asset-header">
                    <div class="asset-icon">📊</div>
                    <div class="asset-price" id="stockPrice">1 000 ₽</div>
                </div>
                <div class="asset-owned" id="stocks">0 шт.</div>
                <input id="stockInput" type="number" placeholder="Количество" inputmode="numeric">
                <div class="button-row">
                    <button id="buyStockButton">Купить</button>
                    <button id="sellStockButton">Продать</button>
                </div>
                <div class="chart-container">
                    <canvas id="stockChart"></canvas>
                </div>
            </div>
        </div>

        <!-- ═══════ ВКЛАДКА ТОП ═══════ -->
        <div id="tab-leaderboard" class="tab-content">
            <div class="section-title">📊 Топ трейдеров</div>
            <div id="leaderboardList" class="leaderboard-list">
                <div class="loading">Загрузка...</div>
            </div>
            <button id="refreshLeaderboard" class="refresh-btn">🔄 Обновить</button>
        </div>

        <!-- ═══════ НОВОСТИ ═══════ -->
        <div class="news-bar">
            <span id="news">📰 Добро пожаловать!</span>
        </div>

        <!-- ═══════ НИЖНЕЕ МЕНЮ ═══════ -->
        <div class="bottom-nav">
            <button class="nav-btn active" onclick="showTab('main')">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Главная</span>
            </button>
            <button class="nav-btn" onclick="showTab('work')">
                <span class="nav-icon">💼</span>
                <span class="nav-label">Работа</span>
            </button>
            <button class="nav-btn" onclick="showTab('leaderboard'); loadLeaderboard();">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Топ</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
